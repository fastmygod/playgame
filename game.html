  :root { --ink: #0b0d12; --paper: #f3ead8; --gold: #d6b46a; --cinnabar: #8b2f2a; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--ink); overflow: hidden; touch-action: none;

    display: flex; align-items: center; justify-content: center; background: var(--ink); }
  #c { display: block; touch-action: none; outline: none; }
  #rotate { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: rgba(8,10,14,.94); color: var(--paper);
    font-family: "Noto Serif SC", "Songti SC", serif; text-align: center; padding: 24px; }
  #rotate[hidden] { display: none; }
  #rotate .ph { width: 54px; height: 90px; border: 3px solid var(--gold); border-radius: 10px; animation: turn 2.2s ease-in-out infinite; }
  #rotate h2 { font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", serif; font-weight: 400; font-size: 34px; margin: 0; color: var(--gold); }
  #rotate p { margin: 0; font-size: 15px; opacity: .8; line-height: 1.7; }
  #rotate button { margin-top: 6px; font: inherit; font-size: 15px; color: var(--paper); background: var(--cinnabar);
    border: 1px solid var(--gold); border-radius: 6px; padding: 10px 22px; }
  #rotate button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  @keyframes turn { 0%,20% { transform: rotate(0); } 50%,80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(-90deg); } }

const SOLID = new Set(['T', '~', 'R', 'H', 'D', 'F', 'B', '#', 'W', 'L', 'w', 'P', 'X', 'E']);
const ENC_TILES = new Set(['f', 'c']);
const DECO_SOLID = new Set(['lantern', 'pot', 'jar', 'crate', 'stall', 'stele', 'willow', 'pavilion', 'bush', 'shrine', 'log', 'rock']);
const tk = (x, y) => x + ',' + y;
for (const k in MAPS) {
  const m = MAPS[k]; m.id = k;
  m.w = Math.max(...m.rows.map(r => r.length)); m.h = m.rows.length;
  m.grid = m.rows.map(r => (r + m.pad.repeat(m.w)).slice(0, m.w).split(''));
  m.decos = m.decos || []; m.signs = m.signs || [];
  // 洞穴：自动在墙面放置火把与灵晶
  if (k === 'cave') {
    const R = seeded(4242);
    for (let y = 1; y < m.h - 1; y++) for (let x = 1; x < m.w - 1; x++) {
      if (m.grid[y][x] === 'W' && 'cd'.includes(m.grid[y + 1][x]) && !m.decos.some(d => d.x === x && d.y === y)) {
        const r = R(); if (r < .1) m.decos.push({ t: 'torch', x, y }); else if (r < .2) m.decos.push({ t: 'crystal', x, y });
      }
    }
  }
  m.solidDeco = new Set();
  m.decoAt = {};
  for (const d of m.decos) {
    const w = d.w || 1, h = d.h || 1;
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) { if (DECO_SOLID.has(d.t)) m.solidDeco.add(tk(d.x + xx, d.y + yy)); m.decoAt[tk(d.x + xx, d.y + yy)] = d; }
  }
  // 识别房屋
  m.buildings = [];
  const seen = new Set();
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    if (!'RHD'.includes(m.grid[y][x]) || seen.has(tk(x, y))) continue;
    let x1 = x; while ('RHD'.includes(m.grid[y][x1 + 1] || '')) x1++;
    let y1 = y; while (y1 + 1 < m.h && 'RHD'.includes(m.grid[y1 + 1][x])) y1++;
    const b = { x0: x, y0: y, x1, y1, door: null, sign: null };
    for (let yy = y; yy <= y1; yy++) for (let xx = x; xx <= x1; xx++) { seen.add(tk(xx, yy)); if (m.grid[yy][xx] === 'D') b.door = { x: xx, y: yy }; }
    if (b.door) b.sign = m.signs.find(s => s.x === b.door.x && s.y === b.door.y) || null;
    m.buildings.push(b);
  }
}

function update(dt) {

    if (fade.dir > 0 && fade.a >= 1) { fade.a = 1; const m = fade.mid; fade.dir = -1; if (m) m(); }
    else if (fade.dir < 0 && fade.a <= 0) { const e = fade.end; fade = null; if (e) e(); }
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt * 2);
  if (mapBanner) mapBanner.t += dt;
  if (hint) hint.t += dt;
  if (state === 'ending') endT += dt;
  switch (state) {
    case 'map': if (!fade) updateMap(dt); updateWorldFx(dt); updateAmb(dt, curMap.amb); break;
    case 'cut': updateCut(dt); updateAmb(dt, curMap.amb); break;
    case 'alert': alertT += dt; if (alertT > .55) startBattle(pick(GROUPS[curMap.enc])); break;
    case 'dialog': case 'menu': case 'shop': if (dialog) dialog.shown += dt * 42; updateWorldFx(dt); updateAmb(dt, curMap.amb); break;
    case 'trans': trans.t += dt; if (trans.t >= trans.dur) { const n = trans.next; trans = null; n(); } break;
    case 'battle': updateBattle(dt); break;
  }
}
