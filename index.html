<style>
  /* 单一水墨夜色主题：游戏画面固定为深色，不随系统主题切换 */
  :root { --ink: #0b0d12; --paper: #f3ead8; --gold: #d6b46a; --cinnabar: #8b2f2a; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--ink); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
    display: flex; align-items: center; justify-content: center; background: var(--ink); }
  #c { display: block; touch-action: none; outline: none; }
  #rotate { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: rgba(8,10,14,.94); color: var(--paper);
    font-family: "Noto Serif SC", "Songti SC", serif; text-align: center; padding: 24px; }
  #rotate[hidden] { display: none; }
  #rotate .ph { width: 54px; height: 90px; border: 3px solid var(--gold); border-radius: 10px; animation: turn 2.2s ease-in-out infinite; }
  #rotate h2 { font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", serif; font-weight: 400; font-size: 34px; margin: 0; color: var(--gold); }
  #rotate p { margin: 0; font-size: 15px; opacity: .8; line-height: 1.7; }
  #rotate button { margin-top: 6px; font: inherit; font-size: 15px; color: var(--paper); background: var(--cinnabar);
    border: 1px solid var(--gold); border-radius: 6px; padding: 10px 22px; }
  #rotate button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  @keyframes turn { 0%,20% { transform: rotate(0); } 50%,80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(-90deg); } }
</style>

function newMember(id) {

function levelUp(p) {

  p.hp = p.mhp; p.mp = p.mmp;

function blocked(x, y, self) {
  const m = curMap;
  const pts = [[x - 7, y - 6], [x + 7, y - 6], [x - 7, y], [x + 7, y]];
  for (const [px, py] of pts) { if (SOLID.has(tileAt(m, Math.floor(px / TILE), Math.floor(py / TILE)))) return true; }
  for (const n of npcs) { if (n === self) continue; if (Math.abs(n.px - x) < 16 && Math.abs(n.py - y) < 11) return true; }
  if (self) { if (Math.abs(player.x - x) < 16 && Math.abs(player.y - y) < 11) return true; }
  for (const c of m.chests) { const cx = c.x * TILE + 16, cy = c.y * TILE + 24; if (Math.abs(cx - x) < 18 && Math.abs(cy - y) < 12) return true; }
  return false;
}
function updateMap(dt) {
  let mx = 0, my = 0;
  if (joy.active) { mx = joy.dx; my = joy.dy; }
  if (keys.ArrowLeft || keys.a || keys.A) mx -= 1; if (keys.ArrowRight || keys.d || keys.D) mx += 1;
  if (keys.ArrowUp || keys.w || keys.W) my -= 1; if (keys.ArrowDown || keys.s || keys.S) my += 1;
  const len = Math.hypot(mx, my);
  if (len > .2) {
    const k = len > 1 ? 1 / len : 1; const sp = 125 * dt;
    const vx = mx * k * sp, vy = my * k * sp;
    const ox = player.x, oy = player.y;
    if (!blocked(player.x + vx, player.y)) player.x += vx;
    if (!blocked(player.x, player.y + vy)) player.y += vy;
    player.dir = Math.abs(mx) > Math.abs(my) ? (mx < 0 ? 1 : 2) : (my < 0 ? 3 : 0);
    const moved = Math.hypot(player.x - ox, player.y - oy);
    player.moving = moved > .01; player.ph += dt * 13;
    if (moved > .01) {
      trail.push({ x: player.x, y: player.y, dir: player.dir }); if (trail.length > 60) trail.shift();
      const tc = tileAt(curMap, Math.floor(player.x / TILE), Math.floor((player.y - 4) / TILE));
      if (curMap.enc && ENC_TILES.has(tc)) {
        encDist += moved;
        if (encDist > TILE * 5 && Math.random() < moved / TILE * .1) { encDist = 0; player.moving = false; joy.active = false; startBattle(pick(GROUPS[curMap.enc])); return; }
      }
    }
  } else player.moving = false;
  // 传送
  const tx = Math.floor(player.x / TILE), ty = Math.floor((player.y - 4) / TILE);
  for (const w of curMap.warps) {
    if (w.x === tx && w.y === ty) {
      if (w.cond && !w.cond()) { player.x += w.back[0] * 14; player.y += w.back[1] * 14; joy.active = false; player.moving = false; runScript(w.deny()); return; }
      joy.active = false; player.moving = false;
      fadeTo(() => { loadMap(w.to, w.tx, w.ty, w.dir); save(); });
      return;
    }
  }
  for (const tr of curMap.triggers) {
    if (!G.flags[tr.flag] && Math.hypot(player.x - tr.x, player.y - tr.y) < tr.r) { joy.active = false; player.moving = false; runScript(tr.run()); return; }
  }
  // NPC 闲逛
  for (const n of npcs) {
    if (!n.wander) continue;
    n.wt -= dt;
    if (n.wt <= 0) { if (n.moving) { n.moving = false; n.wt = rnd(1.5, 3.5); } else { n.moving = true; n.wt = rnd(.5, 1.2); n.dir = ri(0, 3); } }
    if (n.moving) {
      const v = [[0, 1], [-1, 0], [1, 0], [0, -1]][n.dir], sp = 40 * dt;
      const nx = n.px + v[0] * sp, ny = n.py + v[1] * sp;
      if (Math.hypot(nx - n.hx, ny - n.hy) < 50 && !blocked(nx, ny, n)) { n.px = nx; n.py = ny; n.ph += dt * 10; } else { n.moving = false; n.wt = rnd(.5, 1.5); }
    }
  }
}
function interact() {
  const v = [[0, 1], [-1, 0], [1, 0], [0, -1]][player.dir];
  const fx = player.x + v[0] * 24, fy = player.y + v[1] * 22;
  let best = null, bd = 1e9;
  for (const n of npcs) { const d = Math.hypot(n.px - fx, n.py - fy); const d2 = Math.hypot(n.px - player.x, n.py - player.y); if ((d < 24 || d2 < 40) && d < bd) { best = n; bd = d; } }
  if (best) {
    if (!best.enemy) best.dir = Math.abs(player.x - best.px) > Math.abs(player.y - best.py) ? (player.x < best.px ? 1 : 2) : (player.y < best.py ? 3 : 0);
    best.moving = false; player.moving = false; joy.active = false;
    runScript(best.talk()); return;
  }
  for (const c of curMap.chests) {
    const cx = c.x * TILE + 16, cy = c.y * TILE + 24;
    if (Math.hypot(cx - fx, cy - fy) < 26 || Math.hypot(cx - player.x, cy - player.y) < 38) {
      if (G.chests[c.id]) { runScript([narr('箱子里已经空了。')]); return; }
      G.chests[c.id] = true; sfx('chest'); joy.active = false;
      if (c.gold) { G.gold += c.gold; runScript([narr(`打开宝箱，获得 铜钱 ${c.gold}！`)]); }
      else { addItem(c.item, c.n); runScript([narr(`打开宝箱，获得 ${ITEMS[c.item].name} ×${c.n}！`)]); }
      return;
    }

}

let cranes = [{ x: -40, y: 140, s: 1, sp: 26 }, { x: -110, y: 170, s: .8, sp: 24 }, { x: -170, y: 125, s: .7, sp: 25 }];

function drawEnding() {

/* =========================================================
   主循环
   ========================================================= */
function update(dt) {
  if (G && (state === 'map' || state === 'battle' || state === 'dialog')) G.time += dt;
  if (fade) {
    fade.a += dt * 3.2 * fade.dir;
    if (fade.dir > 0 && fade.a >= 1) { fade.a = 1; const m = fade.mid; fade.dir = -1; if (m) m(); }
    else if (fade.dir < 0 && fade.a <= 0) { const e = fade.end; fade = null; if (e) e(); }
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt * 2);
  if (mapBanner) mapBanner.t += dt;
  if (hint) hint.t += dt;
  if (toast) toast.t += dt;
  if (state === 'ending') endT += dt;
  switch (state) {
    case 'map': if (!fade) updateMap(dt); updateAmb(dt, curMap.amb); break;
    case 'dialog': case 'menu': case 'shop': if (dialog) dialog.shown += dt * 42; updateAmb(dt, curMap.amb); break;
    case 'trans': trans.t += dt; if (trans.t >= trans.dur) { const n = trans.next; trans = null; n(); } break;
    case 'battle': updateBattle(dt); break;
  }
}
function render() {

  ctx.fillStyle = '#0b0d12'; ctx.fillRect(0, 0, W, H);

    case 'map': drawMapScene(); drawHUD(); break;
    case 'dialog': drawMapScene(); drawDialog(); break;
    case 'menu': drawMapScene(); drawMenu(); break;
    case 'shop': drawMapScene(); drawShop(); break;
    case 'trans': drawMapScene(); drawTrans(); break;
    case 'battle': if (battle) drawBattle(); break;
    case 'gameover': drawGameOver(); break;
    case 'ending': drawEnding(); break;
  }

}
